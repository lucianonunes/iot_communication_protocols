[project]
name = "iotsim"
version = "0.1.0"
description = "Simulador comparativo de protocolos IoT (MQTT, CoAP, HTTP, AMQP, WebSocket)"
authors = [
    { name = "Luciano Nunes", email = "lnunesdo@cisco.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiocoap>=0.4.17",
    "aiomqtt>=2.5.1",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "influxdb-client[async]>=1.50.0",
    "pydantic-settings>=2.16.1",
    "python-qpid-proton>=0.40.0",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[project.scripts]
iotsim-device = "iotsim.devices.cli:main"
iotsim-http-server = "iotsim.servers.http_server:main"
iotsim-mqtt-consumer = "iotsim.servers.mqtt_consumer:main"
iotsim-coap-server = "iotsim.servers.coap_server:main"
iotsim-amqp-consumer = "iotsim.servers.amqp_consumer:main"
iotsim-ws-server = "iotsim.servers.ws_server:main"

[project.optional-dependencies]
dtls = [
    "dtlssocket==0.2.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["iotsim"]
mypy_path = "src"

[[tool.mypy.overrides]]
# influxdb-client não publica anotações de tipo completas.
module = ["iotsim.sink"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# aiocoap não publica py.typed.
module = ["aiocoap", "aiocoap.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Recursos CoAP precisam herdar das classes (não tipadas) do aiocoap.
module = ["iotsim.servers.coap_server"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
