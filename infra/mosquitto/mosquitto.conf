# Broker MQTT do experimento. Sem autenticação: rede Docker isolada, apenas para medição.
per_listener_settings false
allow_anonymous true

# MQTT sem criptografia
listener 1883

# MQTT sobre TLS (certificados gerados por scripts/gen-certs.sh)
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# TCP_NODELAY, como RabbitMQ e os servidores asyncio: sem ele, o Mosquitto retém o
# CONNACK (Nagle) até o ACK atrasado do cliente, somando ~40 ms a cada conexão TLS.
set_tcp_nodelay true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# Sem limite de mensagens em trânsito, para não distorcer a vazão nos testes de escala.
max_inflight_messages 0
max_queued_messages 10000
