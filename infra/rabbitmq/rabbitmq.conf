# Topologia (fila + binding) e usuário carregados de definições geradas na inicialização.
load_definitions = /tmp/iotsim-definitions.json
loopback_users = none

# AMQP 1.0 sobre TLS (amqps). Autenticação do cliente por usuário e senha (SASL PLAIN);
# o certificado do cliente não é exigido.
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/iotsim/certs/ca.crt
ssl_options.certfile = /etc/iotsim/certs/server.crt
ssl_options.keyfile = /etc/iotsim/certs/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
